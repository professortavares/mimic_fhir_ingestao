version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mimic_fhir_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimic_fhir}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mimic_fhir_app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mimic_fhir}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CAMINHO_ARQUIVO: ${CAMINHO_ARQUIVO:-./data/MimicOrganization.ndjson.gz}
      CAMINHO_ARQUIVO_LOCATION: ${CAMINHO_ARQUIVO_LOCATION:-./data/MimicLocation.ndjson.gz}

volumes:
  postgres_data:
